name: Build binaries

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: docker
    container: rust:1-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux + Windows cross-compile dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            mingw-w64 \
            pkg-config \
            libssl-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev

      - name: Add Windows target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Build Linux binary
        run: cargo build --release

      - name: Build Windows binary
        run: cargo build --release --target x86_64-pc-windows-gnu
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: e-cli-gui-linux-x64
          path: target/release/e-cli-gui

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: e-cli-gui-windows-x64
          path: target/x86_64-pc-windows-gnu/release/e-cli-gui.exe
